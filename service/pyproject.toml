[project]
name = "mimir-tv"
version = "0.1.0"
description = "A Jellyfin library explorer and catalogue maintainer: fills the catalogue, finds and adds what is missing."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "adb-shell==0.4.4",
    "rsa>=4.9",
    "cryptography>=46",
    "jobkit",
    "qrcode>=8",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
mimir-tv = "mimir_tv.app:main"
mimir-tv-setup = "mimir_tv.tvsetup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.uv.sources]
jobkit = { git = "https://github.com/shrshk/jobkit" }
